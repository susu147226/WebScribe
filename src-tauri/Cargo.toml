[package]
name = "webscribe"
version = "0.1.1"
description = "轻量级网页文档抓取、整理与 Markdown/PDF 转存工具"
authors = ["云舒眠眠"]
edition = "2021"
# 文档第 4 条：不得在项目元数据中声明 MIT，亦不得自行声明其他开源许可证。
# 作者尚未指定正式许可证，故此处不设置 license / license-file 字段。
publish = false

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 名与 bin 名冲突
# https://github.com/rust-lang/cargo/issues/8519
name = "webscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
psl = "2"
chrono = "0.4"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]

# 体积优化：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
