[package]
name = "webscribe"
version = "0.1.3"
description = "轻量级网页文档抓取、整理与 Markdown/PDF 转存工具"
authors = ["云舒眠眠"]
edition = "2021"
# 本项目采用自定义的专有许可证，非 OSI 认可的开源许可证。
# 条款见仓库根目录的 LICENSE 文件。
license-file = "../LICENSE"
publish = false

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 名与 bin 名冲突
# https://github.com/rust-lang/cargo/issues/8519
name = "webscribe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
psl = "2"
chrono = "0.4"
thiserror = "2"
anyhow = "1"
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]

# 体积优化：https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
